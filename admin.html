<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organiser Dashboard</title><style>body{font:16px system-ui;background:#f4f4f4;margin:0;padding:20px;color:#222}.card{max-width:760px;margin:25px auto;background:white;padding:22px;border-radius:14px;box-shadow:0 3px 18px #0001}input,button{padding:11px;border:1px solid #aaa;border-radius:7px;font:inherit}button{cursor:pointer;margin:4px}.ticket{border-top:1px solid #ddd;padding:14px 0}.muted{color:#666}</style><div class="card"><h1>Organiser dashboard</h1><p class="muted">Private page — sign in to review applications and confirm payments.</p><form id="login"><input type="password" id="pw" placeholder="Admin password" required><button>Sign in</button></form><p id="msg"></p><div id="list"></div></div><script>let msg=document.querySelector('#msg'),list=document.querySelector('#list');login.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});let d=await r.json();if(!r.ok){msg.textContent=d.error;return;}login.style.display='none';load();};async function load(){let r=await fetch('/api/admin/tickets');if(!r.ok){msg.textContent='Please sign in again.';return;}let a=await r.json();list.innerHTML='<h2>Applications ('+a.length+')</h2>'+a.map(t=>`<div class="ticket"><b>${esc(t.name)}</b> · ${esc(t.code)}<br>${esc(t.phone)} · ${esc(t.paymentMethod)}<br>Status: <b>${esc(t.status.toUpperCase())}</b><br><button onclick="status('${t.code}','confirmed')">Confirm payment</button><button onclick="status('${t.code}','pending')">Set pending</button></div>`).join('')||'No applications yet.';}async function status(code,status){let r=await fetch('/api/admin/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,status})});let d=await r.json();msg.textContent=r.ok?'Updated.':d.error;load();}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script></html>
